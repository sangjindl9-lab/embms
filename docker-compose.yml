# Local development only. Credentials below are throwaway dev values — never reuse in production.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://eumbms:eumbms-dev-only@db:5432/eumbms
      ADMIN_USER: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD (20+ chars) in your shell}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eumbms
      POSTGRES_USER: eumbms
      POSTGRES_PASSWORD: eumbms-dev-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eumbms"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
