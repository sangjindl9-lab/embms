services:
  - type: web
    name: eumbms-web
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eumbms-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ENABLE_POLLING
        value: "false"
databases:
  - name: eumbms-db
    plan: free
    region: singapore
    databaseName: eumbms
    user: eumbms
